<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nexzi_x_grad_dark1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="nexzi_x_grad_dark2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>

    <linearGradient id="nexzi_x_facet_dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <g id="nexzibyte-logo-mark-dark" transform="translate(10, 10)">
    <!-- NE text -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Montserrat', 'Outfit', sans-serif" font-weight="900" font-size="64" letter-spacing="1.5" fill="#FFFFFF">
      NE
    </text>

    <!-- Stylized Geometric Vector X -->
    <g transform="translate(98, 8)">
      <polygon points="0,0 20,0 72,68 52,68" fill="url(#nexzi_x_grad_dark1)" />
      <polygon points="0,68 20,68 72,0 52,0" fill="url(#nexzi_x_grad_dark2)" />
      <polygon points="26,34 36,21 46,34 36,47" fill="url(#nexzi_x_facet_dark)" opacity="0.95" />
      <polygon points="52,0 72,0 62,13 42,13" fill="#E9D5FF" opacity="0.85" />
    </g>

    <!-- ZIBYTE text -->
    <text x="180" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Montserrat', 'Outfit', sans-serif" font-weight="900" font-size="64" letter-spacing="1.5" fill="#FFFFFF">
      ZIBYTE
    </text>
  </g>
</svg>
